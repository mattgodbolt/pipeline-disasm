# Zero page and the other variables outside H.GAME's own bytes.

[symbols]
0x00 = { name = "monster_x", note = "4 monsters of 4 bytes; x, y in character cells" }
0x01 = "monster_y"
0x02 = { name = "monster_direction", note = "0-3 moving, 4-7 stuck, 8 up: not out" }
0x03 = { name = "monster_turns", note = "which ways it tries when it's blocked" }
0x10 = { name = "thrown_x", note = "a thrown object in flight, in character cells" }
0x11 = "thrown_y"
0x12 = { name = "thrown_direction", note = "0: nothing in flight, else direction + 1" }
0x13 = "thrown_picture"
0x14 = "thrown_picture_high"
0x15 = { name = "front_x", note = "the cell in front of the player" }
0x16 = "front_y"
0x17 = { name = "action", note = "the action to do next (see action_table)" }
0x18 = { name = "frame_counter", note = "+&20 a cycle; bit 7 picks the monsters' frame" }
0x19 = { name = "thrown_object", note = "the object in flight, + &80" }
0x1A = { name = "backpack_slot", note = "the selected slot" }
0x1B = { name = "throw_range", note = "cells the thrown object has left to fly" }
0x1C = { name = "started_late", note = "nonzero: the game didn't start on level 1" }
0x1D = { name = "pushes_left", note = "how many more crates the player may push" }
0x1E = { name = "clock_fraction", note = "io_time_rate is added each cycle" }
0x1F = "clip_position"
0x20 = { name = "player_x", note = "the player's cell" }
0x21 = "player_y"
0x22 = { name = "score", note = "BCD: the low two digits" }
0x23 = { name = "score_high", note = "and the high two" }
0x24 = { name = "backpack", note = "4 slots: an object, or negative for empty" }
0x29 = { name = "menu_key_left", note = "the direction keys as MENU set them" }
0x2A = "menu_key_right"
0x2B = "menu_key_up"
0x2C = "menu_key_down"
0x2D = { name = "empty_channel", note = "the sound channel the event says ran dry" }
0x2E = "lives"
0x30 = { name = "sound_channel", note = "an OSWORD 7 block for sound effects" }
0x31 = "sound_channel_high"
0x32 = "sound_amplitude"
0x33 = "sound_amplitude_high"
0x34 = "sound_pitch"
0x35 = "sound_pitch_high"
0x36 = "sound_duration"
0x37 = "sound_duration_high"
0x38 = { name = "tune_channel", note = "an OSWORD 7 block for the tune" }
0x39 = "tune_channel_high"
0x3A = "tune_amplitude"
0x3B = "tune_amplitude_high"
0x3C = "tune_pitch"
0x3D = "tune_pitch_high"
0x3E = "tune_duration"
0x3F = "tune_duration_high"
0x40 = { name = "tune_position", note = "voice 1's next note" }
0x41 = { name = "tune_position_2", note = "voice 2's" }
0x42 = { name = "tune_swap", note = "which voice plays alone" }
0x43 = { name = "tune_transpose", note = "0 or &14" }
0x44 = { name = "tune_together", note = "both voices play, or one" }
0x48 = { name = "triggers_fired", note = "counts triggers that matched" }
0x49 = { name = "level", note = "0-3" }
0x4A = { name = "draw_step", note = "drawing: cells to a picture's edge, a screen step, or flip the player" }
0x4B = "draw_step_high"
0x4C = "monster_index"
0x4E = { name = "picture_stride", note = "bytes from one character cell of a picture to the next across" }
0x4F = { name = "picture_size", note = "negative: 4x4 cells; 1: a 2x2 icon on the floor" }
0x50 = { name = "work0", note = "scratch, used for all sorts" }
0x51 = "work1"
0x52 = "work2"
0x53 = "work3"
0x54 = "work4"
0x55 = "work5"
0x56 = { name = "start_x", note = "the level's setup, copied from io_level_setup" }
0x57 = "start_y"
0x58 = { name = "to_collect", note = "cell 7s still to collect" }
0x59 = { name = "time_left", note = "the clock" }
0x5A = "exit_x"
0x5B = "exit_y"
0x5C = { name = "monster_food", note = "low nibble: a cell monsters eat; high: what they leave" }
0x5D = { name = "alternate_cells", note = "2 bits a cell type: which squares use its second picture" }
0x5E = { name = "player_dead", note = "nonzero: lose a life" }
0x5F = { name = "pipe_move", note = "inside a pipe: the move action that carries the player on" }
0x60 = { name = "stage", note = "0 collecting; 1 exit found; 2 the last few seconds; 3 done" }
0x61 = { name = "furthest_level", note = "the title screen's start level goes up to this" }
0x62 = { name = "front_cell", note = "what's in the cell in front of the player" }
0x63 = { name = "fill_screen", note = "clear_screen fills with the floor pattern, not black" }
0x64 = "tune_off"
0x65 = "effects_off"
0x66 = { name = "action_keys", note = "P, D, M, CTRL, T, Return: actions 1-6" }
0x68 = "key_map"
0x6C = { name = "key_left", note = "this level's direction keys: actions 7-10" }
0x6D = "key_right"
0x6E = "key_up"
0x6F = "key_down"
0x70 = { name = "cell_x", note = "the map cell being looked at or drawn" }
0x71 = "cell_y"
0x72 = { name = "screen_start", note = "the CRTC's start address" }
0x73 = "screen_start_high"
0x74 = { name = "view_sub_x", note = "view_x MOD 4: which character column of the left cell shows" }
0x75 = "view_sub_y"
0x76 = { name = "picture", note = "the picture being drawn" }
0x77 = "picture_high"
0x78 = { name = "screen", note = "where it's being drawn" }
0x79 = "screen_high"
0x7A = "strip_cells"
0x7B = { name = "cell_low_nibble", note = "the cell is in its map byte's low nibble" }
0x7C = "map_pointer"
0x7D = "map_pointer_high"
0x7E = "strip_cells_down"
0x7F = "steps"
0x80 = { name = "view_screen", note = "the screen address of the view's top left" }
0x81 = "view_screen_high"
0x82 = "count_across"
0x83 = "count_down"
0x84 = "player_screen"
0x85 = "player_screen_high"
0x86 = "player_screen_base"
0x87 = "player_screen_base_high"
0x88 = { name = "player_frame", note = "+&20 a step" }
0x89 = { name = "facing", note = "0 left, 1 right, 2 up, 3 down" }
0x8A = { name = "view_x", note = "the view's top left, in character cells (4 to a map cell)" }
0x8B = "view_y"
0x8E = { name = "sprite_columns", note = "character cells to draw, less 1" }
0x8F = "sprite_rows"
0x90 = "sprite_column"
0x91 = "sprite_row"
0x92 = "sprite_screen"
0x93 = "sprite_screen_high"
0x94 = { name = "view_cell_x", note = "view_x DIV 4" }
0x95 = "view_cell_y"
0x96 = "temp"
0x97 = { name = "sprite", note = "the picture being drawn" }
0x98 = "sprite_high"
0x99 = { name = "sprite_skip_x", note = "character cells cut off the left" }
0x9A = "sprite_skip_y"
0x9B = "player_steps"
0xFF = { name = "ESCAPE_FLAG", note = "the OS's: bit 7 set when Escape is pressed" }

0x0100 = { name = "trigger_flags", note = "a byte per trigger, from io_level_trigger_flags" }
0x0120 = { name = "keys_were_down", note = "a byte per direction key, for repeat" }
0x0124 = "offset_y"
0x0240 = { name = "OS_COUNTDOWN", note = "the OS decrements it every 1/50 second" }
0x037F = { name = "saved_extended_vectors", note = "the OS's cassette workspace" }
0x0D00 = { name = "NMI_HANDLER", note = "where the OS jumps on an NMI" }
0x0D9F = { name = "EXTENDED_VECTORS", note = "the OS's extended vector table" }
0x23AD = { name = "trigger_args", note = "4 bytes a trigger, from io_level_trigger_args" }
0x5800 = { name = "map", note = "the level being played's map, copied from io_maps" }
0x6000 = { name = "SCREEN", note = "the game's 8K screen" }

[symbol_comments]
0x00 = '''
Zero page. The loader's block copy uses &00-&07 too (copy_return...).
'''
0x0100 = '''
Elsewhere.
'''

[constants]
menu_keys = { value = "&50", note = "where MENU leaves the ten keys" }
copy_return = "&00"
copy_from = "&02"
copy_to = "&04"
copy_count = "&06"
