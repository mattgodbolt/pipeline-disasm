# &222E-&23AC: loading a mission, the error handler, and the tables at the
# end.

[labels]
0x222E = "load_mission"
0x223D = "load_mission_vectors"
0x225F = "load_mission_block"
0x227B = "swap_memory"
0x228B = "swap_memory_loop"
0x22A0 = "osfile_block_template"
0x22B2 = "osfile_block"
0x22C4 = "mission_filename"
0x22D1 = "read_line_block"
0x22D6 = "disk_command"
0x22DB = "error_handler"
0x22E9 = "error_handler_swap_back"
0x22EC = "error_handler_message"
0x2312 = "error_handler_print"
0x231E = "error_handler_char"
0x2321 = "error_handler_next"
0x2328 = "error_handler_done"
0x2331 = "trigger_actions"
0x2351 = "action_table"
0x2369 = "reverse_moves"
0x236D = "trigger_places"

[comments]
0x222E = '''
Load the mission file named at mission_filename (":0.$.IO" unless the
player has asked for another) to io_start. The game has taken the DFS's
workspace at &0E00-&10FF (and the NMI area and extended vectors), so first
swap &0D00-&1CFF out of the way into the screen, put an RTI where the NMI
handler goes, put back the extended vectors the loader saved, and ask the
filing systems to claim their workspace again (OSBYTE &8F, service calls 1
and 2), then *DISK. Output is turned off while the file loads, then the game
is swapped back.
Clobbers: A, X, Y, work0-work3.
'''
0x227B = '''
Swap &0D00-&1CFF with &6000-&6FFF.
'''
0x22A0 = '''
OSFILE's parameter block: the file name's address, load address io_start
(&0000242D: in the I/O processor, low byte first) and the rest unused; copied
to osfile_block before each load since OSFILE writes into it.
'''
0x22DB = '''
BRKV: an error (from the filing system, loading a mission). If it happened
while the game's code was swapped out (a sample of it isn't where it
should be), swap it back; then show the error and "Press SPACE:" on the
title screen, and start again from the title.
'''
0x2331 = '''
The triggers' actions, by the low nibble of their flags.
'''
0x2351 = '''
The player's actions, by action number: 0 nothing, P, D, M, CTRL, T,
Return, the four directions, and 11 (nothing, when a trigger has stopped
the player).
'''
0x2369 = '''
For each move action (7-10), the opposite one: a pipe turns the player back.
'''
0x236D = '''
Each trigger's place, x and y, copied in by setup_level over what was here.
'''

[remarks]
0x2231 = "A = 0: no starting late on a new mission"
0x2233 = "the game's code out of the way"
0x2236 = "RTI"
0x2238 = "NMIs are ignored until the DFS sets them up"
0x223D = "the extended vectors back"
0x2246 = "service call 1: claim absolute workspace"
0x224F = "service call 2: claim private workspace"
0x225A = "*DISK"
0x2268 = "VDU 21: no output..."
0x2276 = "...VDU 6: output again"
0x22DB = "LDX #7 here means the code is in place"
0x2306 = "the error message"
0x2316 = "spaces as cursor movement, control codes left out"
0x232B = "the stack's no use after an error"

[operands]
0x230E = "ERROR_POINTER + 1"
0x2236 = "#&40"
0x2238 = "NMI_HANDLER"
0x223B = "#&100 - LO(EXTENDED_VECTORS) - 1"
0x2240 = "EXTENDED_VECTORS"
0x2246 = "#&8F"
0x2256 = "#LO(disk_command)"
0x2258 = "#HI(disk_command)"
0x225D = "#osfile_block - osfile_block_template - 1"
0x2268 = "#21"
0x226D = "#LO(osfile_block)"
0x226F = "#HI(osfile_block)"
0x2276 = "#6"
0x2281 = "#HI(SCREEN)"

[[source]]
start = 0x22A0
length = 0x3B
text = '''
    EQUW mission_filename
    EQUD io_start, 0, 0, 0
.osfile_block
    SKIP osfile_block - osfile_block_template

; The mission file's name, and OSWORD 0's block for reading another: up to 12
; characters, from space to &FF.
.mission_filename
    EQUS ":0.$.IO     ", 13
.read_line_block
    EQUW mission_filename
    EQUB 12, 32, &FF
.disk_command
    EQUS "DISK", 13'''

[refer]
0x236E = "trigger_places + 1"
0x23AC = "trigger_args - 1"
