[operands]
0x16CE = "#LO(KEY_S)"
0x16D5 = "#LO(KEY_T)"
0x172C = "#HI(io_tiles)"
0x173B = "#HI(io_player + 2 * 128)"
0x1756 = "#HI(io_tiles)"
0x1761 = "#HI(io_player + 2 * 128)"
0x177B = "#HI(io_tiles)"
0x1783 = "#HI(io_player + 2 * 128)"
0x17CA = "#LO(io_mission_text - io_object_names)"
0x17CC = "#IO_MISSION_SIZE - 1"
0x17D9 = "#HI(io_player)"
0x182E = "#16"
0x1834 = "#33"
0x1838 = "#32"
0x1860 = "#LO(KEY_SPACE)"

[refer]
0x182F = "bit4_mask"

[constants]
bit4_mask = { value = "show_map_centre + 1", note = "the byte there is &10" }
