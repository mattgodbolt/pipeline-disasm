0x16BB = "the map?"
0x16C9 = "out of the backpack screen"
0x16CE = "S: sound effects"
0x16D5 = "T: the tune"
0x16E4 = "on"
0x16E9 = "off"
0x16EC = "blank the old setting"
0x16F5 = "and print the new"
0x16F8 = "a pause"
0x1703 = "right (key_pressed leaves Y = &FF for left)"
0x1707 = "where the cursor is"
0x1713 = "off the left?"
0x1715 = "off the right?"
0x171E = "six character steps a slot"
0x1728 = "rub out..."
0x172C = "...with the floor"
0x173B = "draw it a character on"
0x174D = "slide back the other way"
0x175B = "from below the screen's middle row"
0x1766 = "six steps for each slot"
0x1791 = "* 6"
0x1797 = "+ 7"
0x17A3 = "fill with the floor pattern"
0x17CA = "the mission text"
0x17D1 = "the player's picture for the way they face"
0x17E3 = "along the bottom"
0x17ED = "the exit lit?"
0x17FC = "empty?"
0x1801 = "its icon"
0x1808 = "at slot * 6 + 7, 7"
0x1815 = "on the floor"
0x1820 = "no map this level?"
0x1825 = "remember the view"
0x182B = "player_x - 16..."
