0x16CE = "backpack_keys_sound"
0x16E9 = "backpack_tune_off"
0x16EC = "backpack_show_settings"
0x16FB = "backpack_toggle_effects"
0x1703 = "backpack_select_right"
0x1705 = "backpack_select"
0x171C = "backpack_select_slide"
0x1722 = "backpack_slide_cursor"
0x1744 = "backpack_keys_done"
0x1745 = "backpack_select_wrap_left"
0x174A = "backpack_select_wrap_right"
0x174C = "backpack_select_wrap"
0x1785 = "draw_page_picture"
0x178F = "selection_position"
0x179D = "draw_screen_frame"
0x17C1 = "draw_backpack_screen"
0x17D1 = "draw_lives"
0x17F4 = "draw_backpack"
0x17F8 = "draw_backpack_slot"
0x1819 = "draw_backpack_next"
0x181D = "map_key_done"
0x181E = "map_key"
0x182B = "show_map"
0x182E = "show_map_centre"
0x1834 = "show_map_clamp"
0x183A = "show_map_draw"
0x1845 = "show_map_loop"
