# How the first draft of src/hidden_levdes.6502 was made, with
# tools/dis6502seg.py. The source has since been annotated by hand (and some
# names changed), so don't regenerate over it.
#
# The binary is what the build makes from the source, so the hints still run
# now data/hidden_levdes.bin is gone (`make` first).
binary = "build/files/H.LEVDES"
org = 0x1100
section = 'hidden_levdes, filename="H.LEVDES", org=&1100'
# The startup code, the RDCHV filter, the fixed vectors, and every menu
# handler the jump tables (named by the zero-page pointers) list.
entries = [0x2E21, 0x124A, 0x1100, 0x1103, 0x110A, 0x110D, 0x1196, 0x2350, 0x2353, 0x235C,
    0x0883, 0x1178, 0x1268, 0x1305, 0x1319, 0x131A, 0x1470, 0x147C, 0x1488, 0x1494, 0x16A7, 0x16E5,
    0x16E9, 0x1756, 0x176E, 0x17E2, 0x1802, 0x181A, 0x181E, 0x1822, 0x182F, 0x187E, 0x1896, 0x18E5,
    0x1911, 0x199B, 0x19AA, 0x19E0, 0x1A43, 0x1A93, 0x1AFD, 0x1B2A, 0x1B78, 0x1BC3, 0x1C0A, 0x1C0E,
    0x1C12, 0x1C16, 0x1C21, 0x1C95, 0x1C9C, 0x1CA7, 0x1CAA, 0x1CCA, 0x1CE0, 0x1D17, 0x1D54, 0x1DD2,
    0x1DE5, 0x1E60, 0x1E85, 0x1E8B, 0x1E91, 0x1E97, 0x1E9D, 0x1EBD, 0x1EC9, 0x1ED7, 0x1EDB, 0x1F18,
    0x1F28, 0x1F56, 0x1F5A, 0x1F65, 0x1F78, 0x1F90, 0x1FBD, 0x1FF1, 0x1FFA, 0x2011, 0x201A, 0x2039,
    0x209A, 0x20AA, 0x20BF, 0x20CB, 0x20DD, 0x20EE, 0x210E, 0x2118, 0x2138, 0x21A7, 0x0C99]
traces = ["build/trace/ld_start.json"]

# Moved at startup by the code at &2E21.
[[segment]]
load = 0x25A1
length = 0x40
org = 0x00
name = "zero_page_init"

[[segment]]
load = 0x25E1
length = 0x440
org = 0x0880
name = "low_code"

[[segment]]
load = 0x2A21
length = 0x400
org = 0x0400
name = "font"

# Bytes the disassembler would otherwise read as code.
[data]
"0x1AF5-0x1AF8" = "bytes"
"0x21B0-0x21B0" = "bytes"

